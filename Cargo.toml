[package]
name = "toyBitcoinScript"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.10"
ripemd = "0.1"
secp256k1 = { version = "0.29", features = ["global-context", "rand"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonrpsee = { version = "0.24", features = ["server", "macros"] }